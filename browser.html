<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
    <script type="module">
        import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
        window.BareMux = BareMux;
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://lastra-wisp.onrender.com">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.28/dist/index.mjs">
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.wasm.wasm" as="fetch" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <script src="./script.js" defer></script>
    <style>

    </style>
</head>

<body>
    <!-- Home Button -->


    <div id="app"></div>

    <div class="wisp-settings-modal hidden" id="wisp-settings-modal">
        <div class="settings-card">
            <div class="settings-header">
                <h2><i class="fa-solid fa-sliders"></i> Settings</h2>
                <button class="close-btn" id="close-wisp-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="settings-content">
                <div class="section-title"><i class="fa-solid fa-cloud"></i> Select Server</div>
                <div class="server-list" id="server-list"></div>
                <div class="section-title"><i class="fa-solid fa-plus-circle"></i> Custom Server</div>
                <div class="custom-input-group">
                    <input type="text" id="custom-wisp-input" placeholder="wss://your-wisp-server.com/wisp/">
                    <button id="save-custom-wisp"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="section-title"><i class="fa-solid fa-magnifying-glass"></i> Search Engine</div>
                <div class="custom-input-group"><select id="engine-select"><option value="brave">Brave</option><option value="google">Google</option><option value="duckduckgo">DuckDuckGo</option><option value="bing">Bing</option><option value="startpage">Startpage</option><option value="custom">Custom...</option></select></div>
                <div class="custom-input-group" id="engine-custom-row" style="display:none;margin-top:8px"><input type="text" id="engine-custom-input" placeholder="https://example.com/search?q=%s"><button id="save-engine"><i class="fa-solid fa-check"></i></button></div>
                <div class="section-title"><i class="fa-solid fa-bolt"></i> Speed</div>
                <div class="server-list" id="speed-options"></div>
                <div class="section-title"><i class="fa-solid fa-palette"></i> Theme</div>
                <div class="theme-swatches" id="theme-swatches"></div>
                <div class="custom-input-group" style="margin-top:8px"><input type="color" id="accent-input" title="Accent colour"><button id="reset-theme" title="Reset theme"><i class="fa-solid fa-rotate-left"></i></button></div>
                <div class="section-title"><i class="fa-solid fa-image"></i> New tab wallpaper</div>
                <div class="custom-input-group"><select id="bw-mode"><option value="home">Same as home page</option><option value="file">My file</option><option value="link">Link</option><option value="none">None</option></select></div>
                <div class="custom-input-group" id="bw-file-row" style="display:none;margin-top:8px"><button id="bw-file-btn" style="flex:1">Choose image or video...</button><input type="file" id="bw-file" accept="image/*,video/*" hidden></div>
                <div class="custom-input-group" id="bw-link-row" style="display:none;margin-top:8px"><input type="text" id="bw-link" placeholder="https://example.com/wallpaper.mp4"><button id="bw-link-save"><i class="fa-solid fa-check"></i></button></div>
                <div class="custom-input-group" style="margin-top:8px;align-items:center;gap:10px"><span style="font-size:12px;color:var(--text-muted)">Dim</span><input type="range" id="bw-dim" min="0" max="80" value="25"></div>
            </div>
            <div class="settings-footer">
                Lower ping = faster browsing
            </div>
        </div>
    </div>
</body>

</html>
